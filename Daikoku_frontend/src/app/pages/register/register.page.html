<ion-header>
  <ion-toolbar>
    <ion-title>Registro</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <ion-input
    [(ngModel)]="username"
    placeholder="Username">
  </ion-input>

  <ion-input
    [(ngModel)]="email"
    placeholder="Email">
  </ion-input>

  <ion-input
    [(ngModel)]="password"
    type="password"
    placeholder="Contraseña">
  </ion-input>

  <ion-button expand="block" (click)="register()">
    Registrarse
  </ion-button>

  <ion-button fill="clear" routerLink="/login">
    Volver al login
  </ion-button>

</ion-content>
